<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>漫画日記</title>
    <style>
      body {
        margin: 0;
        background: #f5f5fb;
      }

      #startup-fallback {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        color: #252525;
        font-family: 'Noto Sans JP', 'Noto Sans CJK JP', 'Yu Gothic', sans-serif;
      }

      #startup-fallback-content {
        display: grid;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }

      #startup-fallback img {
        display: block;
        width: 200px;
        max-width: 100%;
        height: auto;
      }

      #startup-fallback h1 {
        margin: 4px 0 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.4;
      }

      #startup-fallback-status {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        color: #6f6f6f;
        font-size: 13px;
      }

      #startup-fallback-indicator {
        box-sizing: border-box;
        width: 15px;
        height: 15px;
        border: 2px solid #e4e4e4;
        border-top-color: #252525;
        border-radius: 50%;
        animation: startup-fallback-spin 900ms linear infinite;
      }

      @keyframes startup-fallback-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-fallback-indicator {
          animation: none;
          border-color: #858585;
          border-top-color: #252525;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-fallback">
        <div id="startup-fallback-content">
          <img src="/cat-mascot.png" alt="" width="480" height="363" />
          <h1>漫画日記</h1>
          <output id="startup-fallback-status" aria-live="polite">
            <span id="startup-fallback-indicator" aria-hidden="true"></span>
            準備中…
          </output>
        </div>
      </div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
